<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>TIENDA</h1>
        <img src="b6c187a41f26ce3a29012f271ab820e2.jpg" alt="Encabezado Tienda" class="encabezado-img">
    </header>

    <main>
        <section class="box">
            <p><b>Bienvenido a la Tienda</b></p>
        </section>

        <section class="box">
            <p><b>Géneros:</b></p>
            <input type="text" placeholder="Escribe aquí...">
        </section>

        <ul class="categorias">
            <li>HOMBRE</li>
            <li>MUJER</li>
            <li>NIÑOS</li>
        </ul>

        <section class="galeria">
            <img src="images.jpeg" alt="Biblioteca">
            <img src="2b929837fb76367f2e62b46407c64a1d.jpg" alt="Ropa Hombre">
            <img src="depositphotos_405750574-stock-photo-young-woman-holds-clothes-hanger.jpg" alt="Ropa Mujer">
        </section>

        <table class="horario">
            <tr>
                <th colspan="3">ATENCIÓN AL PÚBLICO</th>
            </tr>
            <tr>
                <th>Día</th>
                <th>Hora de inicio</th>
                <th>Hora de fin</th>
            </tr>
            <tr>
                <td>Lunes a Viernes</td>
                <td>08:00</td>
                <td>20:00</td>
            </tr>
            <tr>
                <td>Sábado</td>
                <td>09:00</td>
                <td>14:00</td>
            </tr>
            <tr>
                <td>Domingo</td>
                <td colspan="2">Sin atención</td>
            </tr>
        </table>

        <form action="https://www.google.com.ec/?hl=es" method="POST">
            <fieldset>
                <legend>Formulario de Registro</legend>
                <label for="producto">PRODUCTOS</label>
                <input type="text" id="producto" name="producto" placeholder="Escriba el producto"><br>

                <label for="pais">TIENDA DISPONIBLE</label>
                <select id="pais" name="pais">
                    <option value="Ec">Ecuador</option>
                    <option value="Co">Colombia</option>
                    <option value="Pe">Perú</option>
                </select><br>

                <label for="direccion">Dirección de envío</label><br>
                <textarea id="direccion" name="direccion" rows="3" placeholder="Calle Principal 123"></textarea><br>

                <label for="genero">GÉNERO</label>
                <select id="genero" name="genero">
                    <option value="ZAPATOS">ZAPATOS</option>
                    <option value="PANTALONES">PANTALONES</option>
                    <option value="CHAQUETAS">CHAQUETAS</option>
                    <option value="CAMISETAS">CAMISETAS</option>
                </select><br>

                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad"><br>

                <button type="submit">Registrarse</button>
            </fieldset>
        </form>
    </main>
</body>
</html>
